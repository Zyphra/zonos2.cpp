name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Allow the release job to create a GitHub Release on version tags.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux CPU
  linux-cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-cpu
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos2-cli -o -name zonos2-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos2-server -o -name zonos2-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, ~1.5 MB,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos2.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + DAC): the CLI codes/WAV paths on every platform,
      # plus the zonos2-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      # Exercise the end-user launcher (download-if-missing + serve + teardown)
      # against the dummy fixtures and a local http.server standing in for HF.
      - name: Launcher smoke test
        shell: bash
        run: bash tests/launcher-smoke.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos2-cli' -o -name 'spk-encoder-cli' -o -name 'dac-cli' -o -name 'quantize-cli' -o -name 'zonos2-server' \) -type f -exec cp {} dist/ \;
          cp -r web dist/web
          cp -r default_voices emotion_directions dist/
          mkdir -p dist/scripts
          cp scripts/normalize-text.py dist/scripts/
          cp scripts/start-zonos2.sh dist/start-zonos2.sh
          chmod +x dist/start-zonos2.sh
          tar -C dist -czf zonos2-linux-x64-cpu.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-linux-x64-cpu
          path: zonos2-linux-x64-cpu.tar.gz

  # ------------------------------------------------------------- Linux Vulkan
  linux-vulkan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Vulkan SDK (LunarG)
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Resolve ggml submodule rev
        id: ggml
        run: echo "sha=$(git rev-parse HEAD:ggml)" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-vulkan
      # Shader gen (glslc) is the build's long pole and ccache does not cover it;
      # the generated SPIR-V depends only on the ggml submodule. Same approach as
      # the windows-vulkan job.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: linux-vulkan-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('src/**', 'CMakeLists.txt') }}
          restore-keys: |
            linux-vulkan-build-${{ steps.ggml.outputs.sha }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos2-cli -o -name zonos2-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos2-server -o -name zonos2-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, ~1.5 MB,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos2.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + DAC): the CLI codes/WAV paths on every platform,
      # plus the zonos2-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos2-cli' -o -name 'spk-encoder-cli' -o -name 'dac-cli' -o -name 'quantize-cli' -o -name 'zonos2-server' \) -type f -exec cp {} dist/ \;
          cp -r web dist/web
          cp -r default_voices emotion_directions dist/
          mkdir -p dist/scripts
          cp scripts/normalize-text.py dist/scripts/
          # stamp the launcher's backend default to match this archive's build
          sed 's/^GPU_DEFAULT=cpu/GPU_DEFAULT=gpu/' scripts/start-zonos2.sh > dist/start-zonos2.sh
          grep -q '^GPU_DEFAULT=gpu' dist/start-zonos2.sh || { echo "GPU stamp failed"; exit 1; }
          chmod +x dist/start-zonos2.sh
          tar -C dist -czf zonos2-linux-x64-vulkan.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-linux-x64-vulkan
          path: zonos2-linux-x64-vulkan.tar.gz

  # -------------------------------------------------------- Linux desktop app
  # zonos2-app (saucer webview shell). Needs ubuntu-24.04: saucer hard-requires
  # GTK4 >= 4.12 + a C++23 compiler (gcc-14), both beyond the 22.04 jobs above,
  # which stay on 22.04 to keep the glibc baseline of the CLI artifacts.
  linux-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install desktop + Vulkan deps
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk gcc-14 g++-14 \
            libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev libjson-glib-dev
      - name: Resolve ggml submodule rev
        id: ggml
        run: echo "sha=$(git rev-parse HEAD:ggml)" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-app
      # Same shader-gen build-tree cache rationale as the linux-vulkan job.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: linux-app-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('src/**', 'CMakeLists.txt') }}
          restore-keys: |
            linux-app-build-${{ steps.ggml.outputs.sha }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DZONOS2_APP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos2-app -type f | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
          bash tests/app-download-smoke.sh "$bin"
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          find build -name 'zonos2-app' -type f -exec cp {} dist/ \;
          cp -r web dist/web
          cp assets/app/zonos2.desktop assets/app/zonos2.png dist/
          tar -C dist -czf zonos2-linux-x64-app.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-linux-x64-app
          path: zonos2-linux-x64-app.tar.gz

  # ------------------------------------------------------------- macOS Metal
  # macos-15 is Apple Silicon (arm64); Metal is enabled by default in ggml.
  # (15 rather than 14 because zonos2-app's saucer dependency needs AppleClang 17
  # / Xcode >= 16.3.)
  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-metal
      - name: Select Xcode >= 16.3 (saucer needs AppleClang 17)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16.*.app /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer"
          clang++ --version
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DZONOS2_APP=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: App smoke test
        shell: bash
        run: |
          bin=$(find build -path '*Zonos2.app/Contents/MacOS/*' -type f -perm +111 | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos2-cli -o -name zonos2-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos2-server -o -name zonos2-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, ~1.5 MB,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos2.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + DAC): the CLI codes/WAV paths on every platform,
      # plus the zonos2-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      # Exercise the end-user launcher (download-if-missing + serve + teardown)
      # against the dummy fixtures and a local http.server standing in for HF.
      - name: Launcher smoke test
        shell: bash
        run: bash tests/launcher-smoke.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos2-cli' -o -name 'spk-encoder-cli' -o -name 'dac-cli' -o -name 'quantize-cli' -o -name 'zonos2-server' \) -type f -exec cp {} dist/ \;
          cp -r web dist/web
          cp -r default_voices emotion_directions dist/
          mkdir -p dist/scripts
          cp scripts/normalize-text.py dist/scripts/
          # stamp the launcher's backend default to match this archive's build;
          # ship it twice: .command for Finder double-click, .sh for the terminal
          sed 's/^GPU_DEFAULT=cpu/GPU_DEFAULT=gpu/' scripts/start-zonos2.sh > dist/start-zonos2.sh
          grep -q '^GPU_DEFAULT=gpu' dist/start-zonos2.sh || { echo "GPU stamp failed"; exit 1; }
          cp dist/start-zonos2.sh dist/start-zonos2.command
          chmod +x dist/start-zonos2.sh dist/start-zonos2.command
          tar -C dist -czf zonos2-macos-arm64-metal.tar.gz .
          # Desktop app bundle, ad-hoc signed (users right-click > Open past Gatekeeper).
          app=$(find build -name 'Zonos2.app' -type d | head -1)
          codesign --force --deep -s - "$app"
          ditto -c -k --keepParent "$app" zonos2-macos-arm64-app.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-macos-arm64-metal
          path: zonos2-macos-arm64-metal.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-macos-arm64-app
          path: zonos2-macos-arm64-app.zip

  # ----------------------------------------------------------- Windows Vulkan
  # MSVC build; relies on the _WIN32 file-IO shim in src/compat.h.
  windows-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Ninja needs cl.exe on PATH (the VS generator found it implicitly).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Resolve ggml submodule rev
        id: ggml
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:ggml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.313.2
          key: vulkan-sdk-1.4.313.2
      - name: Install Vulkan SDK (LunarG)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # 1.4.313.2 bundles the SPIRV-Headers CMake config that ggml-vulkan
          # requires via find_package(SPIRV-Headers CONFIG). Note the 1.4.x Windows
          # installer is named vulkansdk-windows-X64-<ver>.exe; the legacy
          # VulkanSDK-<ver>-Installer.exe name only exists for <=1.3.x.
          $ver = "1.4.313.2"
          curl.exe -L -o VulkanSDK.exe "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          if ((Get-Item VulkanSDK.exe).Length -lt 50MB) { throw "Vulkan SDK download failed: got $((Get-Item VulkanSDK.exe).Length) bytes" }
          .\VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
      - name: Set Vulkan SDK env
        shell: pwsh
        run: |
          $ver = "1.4.313.2"
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-vulkan
      # The generated SPIR-V shaders (the build's long pole) depend only on the ggml
      # submodule, so key the build tree on its rev. restore-keys lets a src-only
      # change reuse the cached shaders + unchanged objects and rebuild just the
      # changed C++; the restored .spv are newer than the checked-out .comp, so the
      # shader-gen step is a no-op.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: win-vulkan-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('src/**', 'CMakeLists.txt') }}
          restore-keys: |
            win-vulkan-build-${{ steps.ggml.outputs.sha }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZONOS2_APP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j
      - name: App smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos2-app.exe -type f | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos2-cli.exe -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build -name zonos2-server.exe -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, ~1.5 MB,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos2.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + DAC): the CLI codes/WAV paths on every platform,
      # plus the zonos2-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      # The launcher can't run end-to-end here (no bash trap semantics; see
      # tests/launcher-smoke.sh for the Linux/macOS coverage), but a parse check
      # catches ps1 syntax errors before they ship in a release archive.
      - name: Launcher parse check
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\start-zonos2.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; throw "start-zonos2.ps1 has parse errors" }
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos2-cli.exe' -o -name 'spk-encoder-cli.exe' -o -name 'dac-cli.exe' -o -name 'quantize-cli.exe' -o -name 'zonos2-server.exe' -o -name 'zonos2-app.exe' \) -type f -exec cp {} dist/ \;
          cp -r web dist/web
          cp -r default_voices emotion_directions dist/
          mkdir -p dist/scripts
          cp scripts/normalize-text.py dist/scripts/
          # stamp the launcher's backend default to match this archive's build
          sed "s/^\\\$GPU_DEFAULT = 'cpu'/\$GPU_DEFAULT = 'gpu'/" scripts/start-zonos2.ps1 > dist/start-zonos2.ps1
          grep -q "^\\\$GPU_DEFAULT = 'gpu'" dist/start-zonos2.ps1 || { echo "GPU stamp failed"; exit 1; }
          cp scripts/start-zonos2.bat dist/start-zonos2.bat
          # zip, not tar.gz: Explorer extracts it natively and (unlike tar) keeps
          # the Mark-of-the-Web flow the README's SmartScreen guidance describes
          (cd dist && 7z a -tzip ../zonos2-windows-x64-vulkan.zip . > /dev/null)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zonos2-windows-x64-vulkan
          path: zonos2-windows-x64-vulkan.zip

  # ------------------------------------------------- Release (version tags only)
  release:
    needs: [linux-cpu, linux-vulkan, linux-app, macos-metal, windows-vulkan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
